# Windows build for GitHub Releases.
# - Publishing a release (tag vX.Y.Z, created with the macOS zip attached; see README "Releasing")
#   builds and tests the Windows exes, attaches them plus both installers, and writes SHA256SUMS
#   over every zip in the release.
# - "Run workflow" (workflow_dispatch) does the same build and checks without touching a release.
name: release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  LLVM_MINGW: llvm-mingw-20261104-ucrt-x86_64
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-ucrt-x86_64.zip

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM-MinGW and Rust targets
        run: |
          Invoke-WebRequest $env:LLVM_MINGW_URL -OutFile "$env:RUNNER_TEMP\llvm-mingw.zip"
          Expand-Archive "$env:RUNNER_TEMP\llvm-mingw.zip" $env:RUNNER_TEMP
          $bin = "$env:RUNNER_TEMP\$env:LLVM_MINGW\bin"
          $bin >> $env:GITHUB_PATH
          "WINDRES=$bin\llvm-windres.exe" >> $env:GITHUB_ENV
          foreach ($t in 'X86_64', 'AARCH64') {
            $cc = if ($t -eq 'X86_64') { 'x86_64' } else { 'aarch64' }
            "CARGO_TARGET_${t}_PC_WINDOWS_GNULLVM_LINKER=$bin\$cc-w64-mingw32-clang.exe" >> $env:GITHUB_ENV
            "CARGO_TARGET_${t}_PC_WINDOWS_GNULLVM_RUSTFLAGS=-Cdlltool=$bin\llvm-dlltool.exe" >> $env:GITHUB_ENV
          }
          rustup target add x86_64-pc-windows-gnullvm aarch64-pc-windows-gnullvm

      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'release'
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne '${{ github.event.release.tag_name }}') { throw "Cargo.toml version $v does not match tag ${{ github.event.release.tag_name }}" }

      - name: Test
        run: cargo test

      - name: Build x64 and arm64
        run: |
          cargo build --release --target x86_64-pc-windows-gnullvm
          cargo build --release --target aarch64-pc-windows-gnullvm

      - name: Check icons and version are embedded, then zip
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory dist | Out-Null
          foreach ($a in @{ name = 'x64'; triple = 'x86_64-pc-windows-gnullvm' }, @{ name = 'arm64'; triple = 'aarch64-pc-windows-gnullvm' }) {
            $exe = "target\$($a.triple)\release\coffee-bar.exe"
            $res = llvm-readobj --coff-resources $exe | Out-String
            foreach ($kind in 'ICON', 'GROUP_ICON', 'VERSION', 'MANIFEST') {
              if ($res -notmatch "Type: $kind") { throw "$($a.name): resource $kind missing" }
            }
            if ((Get-Item $exe).VersionInfo.ProductVersion -ne $v) { throw "$($a.name): wrong ProductVersion" }
            New-Item -ItemType Directory "stage-$($a.name)" | Out-Null
            Copy-Item $exe "stage-$($a.name)\coffee-bar.exe"
            Compress-Archive "stage-$($a.name)\coffee-bar.exe" "dist\coffee-bar-windows-$($a.name).zip"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Test install.ps1 (PowerShell 7 and Windows PowerShell 5.1)
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\coffee-bar\coffee-bar.exe"
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'coffee-bar.lnk'
          foreach ($ps in 'pwsh', 'powershell') {
            & $ps -NoProfile -ExecutionPolicy Bypass -File install.ps1 -ZipPath dist\coffee-bar-windows-x64.zip -NoLaunch -StartAtLogin
            if ($LASTEXITCODE) { throw "$ps install failed" }
            if (-not (Test-Path $exe) -or -not (Test-Path $lnk)) { throw "$ps install: files missing" }
            if (-not (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -Name coffee-bar -ErrorAction SilentlyContinue)) { throw "$ps install: Run value missing" }
            & $ps -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Uninstall
            if ((Test-Path $exe) -or (Test-Path $lnk)) { throw "$ps uninstall left files behind" }
            if (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -Name coffee-bar -ErrorAction SilentlyContinue) { throw "$ps uninstall left the Run value" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-bar-windows
          path: windows/dist/*.zip

      - name: Attach to the release and write SHA256SUMS
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload $env:TAG dist\coffee-bar-windows-x64.zip dist\coffee-bar-windows-arm64.zip install.ps1 ..\macos\install.sh --clobber
          New-Item -ItemType Directory all | Out-Null
          gh release download $env:TAG --pattern '*.zip' --dir all
          $lines = Get-ChildItem all\*.zip | Sort-Object Name | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_).Hash.ToLower())  $($_.Name)" }
          [IO.File]::WriteAllText("$PWD\SHA256SUMS", (($lines -join "`n") + "`n"))
          Get-Content SHA256SUMS
          gh release upload $env:TAG SHA256SUMS --clobber
