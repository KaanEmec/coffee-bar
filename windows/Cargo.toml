[package]
name = "coffee-bar"
version = "0.1.1"
edition = "2021"
description = "Keep a Windows laptop awake for a chosen time, even with the lid closed"
license = "MIT"

[dependencies]
tray-icon = "0.26"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_Performance",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
